# ============================================================================
# workingspace.id — deployment PRODUKSI (VPS). Panduan lengkap: docs/DEPLOYMENT.md
#   ROOT_DOMAIN (workingspace.id)        → halaman depan (landing)
#   AUTH_DOMAIN (auth.workingspace.id)   → SSO: auth-api + auth-web (docs/SSO.md)
#   APP_DOMAIN  (akasha.workingspace.id) → Akasha: backend + frontend
#   AKAI_DOMAIN (akai.workingspace.id)   → Akai: akai-api (/api) + akai-web (gateway model, docs/AKAI.md)
#
#   cp .env.example .env        # isi domain, secret, password
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec auth-api node dist/database/seed.js  # sekali: aplikasi + super admin SSO
#   docker compose -f docker-compose.prod.yml exec backend node dist/database/seed.js   # sekali
#
# Hanya Caddy yang membuka port (80/443, HTTPS otomatis). Database, Redis, dan
# object storage hanya dapat diakses dari jaringan internal Docker.
# Editor dokumen ONLYOFFICE (opsional, butuh ± 2–3 GB RAM → VPS 8 GB): COMPOSE_PROFILES=office + ONLYOFFICE_* di .env
# (docs/DEPLOYMENT.md §9).
# ============================================================================

name: akasha-prod

# Batas memori default untuk VPS 4 GB (total ± 3,3 GB). VPS 2 GB: lihat docs/DEPLOYMENT.md §1.1.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
      auth-api: { condition: service_healthy }
      auth-web: { condition: service_started }
      landing: { condition: service_started }
      akai-api: { condition: service_healthy }
      akai-web: { condition: service_started }
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN:?Set ROOT_DOMAIN di .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Set AUTH_DOMAIN di .env}
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN di .env}
      AKAI_DOMAIN: ${AKAI_DOMAIN:?Set AKAI_DOMAIN di .env}
      # https (bawaan) = sertifikat otomatis; http HANYA untuk uji stack di laptop (*.localhost, DEPLOYMENT §0.4)
      SITE_SCHEME: ${SITE_SCHEME:-https}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL di .env}
    networks:
      default:
        # Backend memanggil SSO (issuer OIDC) dan SSO memanggil backend (logout token) lewat alamat publik;
        # alias ini menjawabnya di jaringan internal
        aliases: ["${AUTH_DOMAIN}", "${APP_DOMAIN}", "${AKAI_DOMAIN}"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    deploy: { resources: { limits: { memory: 128m } } }
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: apps/akasha/web/Dockerfile
    image: akasha-web:${APP_VERSION:-latest}
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 64m } } }
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: apps/akasha/api/Dockerfile
    image: akasha-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      NODE_ENV: production
      # Heap V8 di bawah batas memori container agar GC bekerja sebelum OOM kill
      NODE_OPTIONS: --max-old-space-size=${BACKEND_HEAP_MB:-512}
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GEOIP_PROVIDER: ${GEOIP_PROVIDER:-}
      DATABASE_URL: postgresql://akasha:${POSTGRES_PASSWORD}@postgres:5432/akasha?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET di .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET di .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:?Set AI_ENCRYPTION_KEY di .env}
      CORS_ORIGIN: ${SITE_SCHEME:-https}://${APP_DOMAIN}
      TRUST_PROXY: "true"
      # Kosong = Secure (HTTPS). Set false HANYA untuk uji coba tanpa domain/HTTPS (lihat DEPLOYMENT.md §0.4)
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD di .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID di .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY di .env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ASSET_BUCKET: ${ASSET_BUCKET:-akasha-assets}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-300}
      # Masuk lewat SSO workingspace.id (docs/SSO.md). Secret = klien "akasha" di OIDC_CLIENTS service auth-api
      SSO_ISSUER: ${SITE_SCHEME:-https}://${AUTH_DOMAIN}/oidc
      SSO_CLIENT_ID: akasha
      SSO_CLIENT_SECRET: ${SSO_AKASHA_CLIENT_SECRET:?Set SSO_AKASHA_CLIENT_SECRET di .env}
      SSO_REDIRECT_URI: ${SITE_SCHEME:-https}://${APP_DOMAIN}/api/v1/auth/sso/callback
      SSO_POST_LOGOUT_URI: ${SITE_SCHEME:-https}://${APP_DOMAIN}/login
      # Editor ONLYOFFICE (kosong = nonaktif). URL publik = https://<APP_DOMAIN>/office (Caddy, satu domain)
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_URL:+http://onlyoffice}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_BACKEND_URL: http://backend:4000
      ONLYOFFICE_FONTS_DIR: ${ONLYOFFICE_URL:+/app/office-fonts}
      # Vault Obsidian (basis pengetahuan): folder host ./knowledge-vaults/<folder user>, diisi Syncthing (DEPLOYMENT §10)
      KNOWLEDGE_VAULTS_DIR: /app/knowledge-vaults
      # Bot WhatsApp satker (opsional, DEPLOYMENT §11)
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_OWNER_EMAIL: ${WHATSAPP_OWNER_EMAIL:-}
      # Konektor robot SRIKANDI & e-Kinerja (opsional, COMPOSE_PROFILES=robot, DEPLOYMENT §13)
      ROBOT_URL: ${ROBOT_TOKEN:+http://robot:4100}
      ROBOT_TOKEN: ${ROBOT_TOKEN:-}
      # Markdown Converter MarkItDown + Docling (opsional, COMPOSE_PROFILES=converter, DEPLOYMENT §15)
      CONVERTER_URL: ${CONVERTER_TOKEN:+http://converter:4200}
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
      CONVERTER_MAX_MB: ${CONVERTER_MAX_MB:-50}
      # Brankas kredensial SRIKANDI/e-Kinerja (64 hex, terpisah dari AI_ENCRYPTION_KEY; kosong = nonaktif)
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      # Asisten Agen Hermes (opsional, COMPOSE_PROFILES=agent, DEPLOYMENT §14; docs/AI-AGENT.md §23)
      HERMES_URL: ${HERMES_API_KEY:+http://hermes:8642}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_OWNER_EMAIL: ${HERMES_OWNER_EMAIL:-}
      HERMES_SKILLS_DIR: /app/agent-skills
      # Gateway model Akai (jaringan internal; tugas yang diatur pemilik di Akai dijawab Akai, docs/AKAI.md §4)
      AKAI_URL: http://akai-api:4400
      AKAI_CLIENT_ID: akasha
      AKAI_CLIENT_SECRET: ${AKAI_AKASHA_CLIENT_SECRET:?Set AKAI_AKASHA_CLIENT_SECRET di .env}
      AKAI_WEB_URL: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}
      # Akun Tersambung tahap 2: OAuth client milik pemilik (kosong = tombol Sambungkan nonaktif; docs/AKUN-TERSAMBUNG.md §9)
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_TENANT: ${MICROSOFT_OAUTH_TENANT:-consumers}
      GOOGLE_PICKER_API_KEY: ${GOOGLE_PICKER_API_KEY:-}
      GOOGLE_PICKER_APP_ID: ${GOOGLE_PICKER_APP_ID:-}
    volumes:
      # Font tambahan yang diunggah admin (Tools → ONLYOFFICE); dibaca container onlyoffice
      - onlyoffice-fonts:/app/office-fonts
      - ./knowledge-vaults:/app/knowledge-vaults
      # Skill Hermes dari repo (daftar skill di Asisten Agen; folder sama dipasang ke container hermes)
      - ./apps/akai/agent/skills:/app/agent-skills:ro
    networks:
      default:
      agent:
        # Alamat backend yang dipakai MCP Hermes (sama dengan dev: apps/akai/agent/hermes/akasha-mcp.yaml)
        aliases: [akasha-api]
    deploy: { resources: { limits: { memory: "${BACKEND_MEM_LIMIT:-768m}" } } }
    logging: *logging

  auth-api:
    # SSO workingspace.id (akun, OIDC, PIN, admin). Migrasi database dijalankan saat start. docs/SSO.md
    build:
      context: .
      dockerfile: apps/auth/api/Dockerfile
    image: workingspace-auth-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${AUTH_HEAP_MB:-192}
      PORT: 4300
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://akasha:${POSTGRES_PASSWORD}@postgres:5432/workingspace_auth?schema=public
      PUBLIC_URL: ${SITE_SCHEME:-https}://${AUTH_DOMAIN}
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Kunci penanda tangan token & cookie (buat dengan: node apps/auth/api/scripts/generate-prod-secrets.mjs)
      OIDC_JWKS: ${OIDC_JWKS:?Set OIDC_JWKS di .env}
      OIDC_COOKIE_KEYS: ${OIDC_COOKIE_KEYS:?Set OIDC_COOKIE_KEYS di .env}
      # Klien OIDC = aplikasi ekosistem. Aplikasi baru → tambahkan objek baru di array ini
      OIDC_CLIENTS: >-
        [{"client_id":"akasha","client_secret":"${SSO_AKASHA_CLIENT_SECRET}",
        "redirect_uris":["${SITE_SCHEME:-https}://${APP_DOMAIN}/api/v1/auth/sso/callback"],
        "post_logout_redirect_uris":["${SITE_SCHEME:-https}://${APP_DOMAIN}/login"],
        "backchannel_logout_uri":"${SITE_SCHEME:-https}://${APP_DOMAIN}/api/v1/auth/sso/backchannel-logout"},
        {"client_id":"akai","client_secret":"${SSO_AKAI_CLIENT_SECRET}",
        "redirect_uris":["${SITE_SCHEME:-https}://${AKAI_DOMAIN}/api/auth/sso/callback"],
        "post_logout_redirect_uris":["${SITE_SCHEME:-https}://${AKAI_DOMAIN}/login"],
        "backchannel_logout_uri":"${SITE_SCHEME:-https}://${AKAI_DOMAIN}/api/auth/sso/backchannel-logout"}]
      # Halaman depan yang boleh membaca status masuk (tombol Dashboard)
      LANDING_URL: ${SITE_SCHEME:-https}://${ROOT_DOMAIN}
      # Email verifikasi & reset (Titan, noreply@workingspace.id)
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST di .env}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Workingspace <noreply@workingspace.id>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Seed produksi: super admin pertama ekosistem + alamat aplikasi
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_AKASHA_URL: ${SITE_SCHEME:-https}://${APP_DOMAIN}
      SEED_AKAI_URL: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}
    deploy: { resources: { limits: { memory: "${AUTH_MEM_LIMIT:-256m}" } } }
    logging: *logging

  auth-web:
    # Halaman masuk, daftar, akun, admin SSO (nginx statis)
    build:
      context: .
      dockerfile: apps/auth/web/Dockerfile
    image: workingspace-auth-web:${APP_VERSION:-latest}
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 32m } } }
    logging: *logging

  akai-api:
    # Akai: gateway model ekosistem (router & API key model milik tiap akun, pembagian tugas, cadangan, jalur agen).
    # /api/* lewat Caddy (Akai web); /gateway/* hanya jaringan internal (Akasha → http://akai-api:4400). docs/AKAI.md
    build:
      context: .
      dockerfile: apps/akai/api/Dockerfile
    image: akai-api:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${AKAI_HEAP_MB:-320}
      PORT: 4400
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://akasha:${POSTGRES_PASSWORD}@postgres:5432/akai?schema=public
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      # Kunci enkripsi API key sumber model (64 hex). Mengganti = key tersimpan tidak terbaca
      AKAI_ENCRYPTION_KEY: ${AKAI_ENCRYPTION_KEY:?Set AKAI_ENCRYPTION_KEY di .env}
      # Aplikasi ekosistem yang boleh memanggil gateway. Aplikasi baru → objek baru di array ini
      AKAI_CLIENTS: >-
        [{"client_id":"akasha","client_secret":"${AKAI_AKASHA_CLIENT_SECRET}"}]
      # Masuk Akai web lewat SSO (klien OIDC "akai" di OIDC_CLIENTS auth-api)
      SSO_ISSUER: ${SITE_SCHEME:-https}://${AUTH_DOMAIN}/oidc
      SSO_CLIENT_ID: akai
      SSO_CLIENT_SECRET: ${SSO_AKAI_CLIENT_SECRET:?Set SSO_AKAI_CLIENT_SECRET di .env}
      SSO_REDIRECT_URI: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}/api/auth/sso/callback
      SSO_POST_LOGOUT_URI: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}/login
      # Konektor Akasha di chat Akai (MCP Akasha lewat jaringan internal; token akses dibuat pemilik di Akasha)
      AKASHA_MCP_URL: http://backend:4000/api/v1/mcp
      # Email hasil tugas terjadwal (SMTP sama dengan SSO)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "Akai <${SMTP_USER:-noreply@workingspace.id}>"
      AKAI_WEB_URL: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}
    deploy: { resources: { limits: { memory: "${AKAI_MEM_LIMIT:-448m}" } } }
    logging: *logging

  akai-web:
    # Akai web: pengaturan model (sumber, model, tugas, pemakaian), masuk lewat SSO (nginx statis)
    build:
      context: .
      dockerfile: apps/akai/web/Dockerfile
    image: akai-web:${APP_VERSION:-latest}
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 32m } } }
    logging: *logging

  landing:
    # Halaman depan workingspace.id (nginx statis). Alamat SSO & Akasha ditanam saat build
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
      args:
        VITE_AUTH_URL: ${SITE_SCHEME:-https}://${AUTH_DOMAIN}
        VITE_AKASHA_URL: ${SITE_SCHEME:-https}://${APP_DOMAIN}
        VITE_AKAI_URL: ${SITE_SCHEME:-https}://${AKAI_DOMAIN}
    image: workingspace-landing:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      # Alamat SSO yang boleh dipanggil halaman (CSP connect-src, status masuk)
      AUTH_ORIGIN: ${SITE_SCHEME:-https}://${AUTH_DOMAIN}
    deploy: { resources: { limits: { memory: 32m } } }
    logging: *logging

  postgres:
    # PostgreSQL major baru = volume baru + dump/restore (docs/DEPLOYMENT.md §8), bukan sekadar ganti tag.
    image: pgvector/pgvector:0.8.7-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: akasha
      POSTGRES_USER: akasha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di .env}
    # Tuning untuk VPS kecil (default PostgreSQL mengasumsikan RAM sangat sedikit). Sesuaikan dengan POSTGRES_MEM_LIMIT.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - work_mem=${PG_WORK_MEM:-8MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=50
    shm_size: 256m
    volumes:
      # Image 18+: mount ke /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - postgres18-data:/var/lib/postgresql
      # Hanya dijalankan pada volume kosong: membuat database SSO workingspace_auth (volume lama: DEPLOYMENT §16)
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akasha -d akasha"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: "${POSTGRES_MEM_LIMIT:-1g}" } } }
    logging: *logging

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --maxmemory "$$REDIS_MAXMEMORY" --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD di .env}
      # Di bawah batas container: saat penuh Redis menolak tulis (noeviction) alih-alih di-OOM kill
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-192mb}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy: { resources: { limits: { memory: "${REDIS_MEM_LIMIT:-256m}" } } }
    logging: *logging

  storage:
    # SeaweedFS S3. Kredensial dirender dari env saat start (tidak ada kredensial bawaan).
    # Untuk S3/R2/B2 eksternal: set S3_ENDPOINT & kredensialnya di .env (service ini boleh dibiarkan).
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID di .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY di .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"akasha","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy: { resources: { limits: { memory: "${STORAGE_MEM_LIMIT:-512m}" } } }
    logging: *logging

  onlyoffice:
    # Editor dokumen ONLYOFFICE Docs Community + plugin AI yang memakai AI Akasha (infra/onlyoffice/Dockerfile).
    # Opsional: hanya menyala dengan COMPOSE_PROFILES=office. Disajikan Caddy di https://<APP_DOMAIN>/office/.
    build: ./infra/onlyoffice
    image: akasha-onlyoffice:${APP_VERSION:-latest}
    restart: unless-stopped
    profiles: ["office"]
    environment:
      JWT_ENABLED: "true"
      # = ONLYOFFICE_JWT_SECRET backend (openssl rand -hex 32). Kosong ditolak backend saat ONLYOFFICE_URL diisi.
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      JWT_HEADER: AuthorizationJwt
      # Backend dihubungi lewat jaringan internal Docker (alamat privat)
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/lib/onlyoffice
      - onlyoffice-logs:/var/log/onlyoffice
      - onlyoffice-fonts:/usr/share/fonts/truetype/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/healthcheck | grep -q true"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    deploy: { resources: { limits: { memory: "${ONLYOFFICE_MEM_LIMIT:-2560m}" } } }
    logging: *logging

  robot:
    # Browser otomatis (Playwright) untuk konektor SRIKANDI & e-Kinerja (Tools → Konektor Robot).
    # Opsional: hanya menyala dengan COMPOSE_PROFILES=robot. Tidak membuka port & tidak menyimpan data (sesi login
    # disimpan backend terenkripsi). Hanya backend yang memanggilnya lewat jaringan internal Docker.
    build:
      context: .
      dockerfile: services/robot/Dockerfile
    image: akasha-robot:${APP_VERSION:-latest}
    restart: unless-stopped
    profiles: ["robot"]
    environment:
      # = ROBOT_TOKEN backend (openssl rand -hex 32)
      ROBOT_TOKEN: ${ROBOT_TOKEN:-}
    shm_size: 512m
    init: true
    deploy: { resources: { limits: { memory: "${ROBOT_MEM_LIMIT:-1024m}" } } }
    logging: *logging

  converter:
    # Markdown Converter (Tools → Markdown Converter, docs/ARCHITECTURE.md §3.14): MarkItDown + Docling (OCR Tesseract).
    # Opsional: COMPOSE_PROFILES=converter. Tanpa port publik & tanpa data; model Docling ada di image (tidak perlu internet).
    build: ./services/converter
    image: akasha-converter:${APP_VERSION:-latest}
    restart: unless-stopped
    profiles: ["converter"]
    environment:
      # = CONVERTER_TOKEN backend (openssl rand -hex 32)
      CONVERTER_TOKEN: ${CONVERTER_TOKEN:-}
      CONVERTER_MAX_MB: ${CONVERTER_MAX_MB:-50}
      # Thread CPU Docling per konversi (VPS 2 vCPU = 2)
      DOCLING_THREADS: ${DOCLING_THREADS:-2}
      OMP_NUM_THREADS: ${DOCLING_THREADS:-2}
    init: true
    # OCR Docling memakai semua core bila dibiarkan → dibatasi agar aplikasi lain tetap responsif (VPS 8 vCPU: CONVERTER_CPUS=4)
    deploy: { resources: { limits: { memory: "${CONVERTER_MEM_LIMIT:-2048m}", cpus: "${CONVERTER_CPUS:-2}" } } }
    logging: *logging

  hermes:
    # Agen AI Hermes (Asisten Agen Akasha, skill dokumen bertemplat; docs/AI-AGENT.md §23, DEPLOYMENT §14).
    # Opsional: COMPOSE_PROFILES=agent. Tanpa port publik — hanya backend yang memanggil API server-nya, dan Hermes
    # memanggil MCP & model Akasha lewat http://akasha-api:4000 (configure.sh; API key model tetap di Akasha, §14).
    image: nousresearch/hermes-agent:${HERMES_TAG:-v0.22.2}
    restart: unless-stopped
    profiles: ["agent"]
    command: gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      # = HERMES_API_KEY backend (openssl rand -hex 32); juga kunci Hermes → Akasha (MCP + model)
      API_SERVER_KEY: ${HERMES_API_KEY:-}
    volumes:
      # config.yaml, memori, sesi — dicadangkan terpisah (DEPLOYMENT §14)
      - hermes-data:/opt/data
      - ./apps/akai/agent/skills:/opt/data/skills/akasha:ro
      - ./apps/akai/agent/hermes:/opt/akasha:ro
    # Jaringan sendiri: agen hanya menjangkau backend, bukan database, Redis, storage, atau robot (docs/AI-AGENT.md §26)
    networks: [agent]
    shm_size: 1g
    deploy: { resources: { limits: { memory: "${HERMES_MEM_LIMIT:-1536m}" } } }
    logging: *logging

  syncthing:
    # Sinkron vault Obsidian laptop/HP ↔ VPS ke ./knowledge-vaults (dibaca backend; DEPLOYMENT §10).
    # Opsional: COMPOSE_PROFILES=sync. Obsidian sendiri tidak berjalan di server — Akasha hanya membaca berkas Markdown.
    # UID/GID 1000 = user node backend, agar backend tetap bisa menulis 00-Inbox dan Syncthing membaca hasilnya.
    image: syncthing/syncthing:${SYNCTHING_TAG:-2.1.6}
    restart: unless-stopped
    profiles: ["sync"]
    hostname: akasha-vps
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      # Konfigurasi & kunci perangkat (Device ID) — hilang = perangkat harus dipasangkan ulang
      - syncthing-data:/var/syncthing/config
      - ./knowledge-vaults:/var/syncthing/knowledge-vaults
    ports:
      # Protokol sinkron (TCP + QUIC); terenkripsi & hanya perangkat yang Anda setujui yang bisa terhubung
      - "${SYNCTHING_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_PORT:-22000}:22000/udp"
      # Antarmuka web hanya di localhost VPS → buka lewat tunnel SSH, jangan ke internet
      - "127.0.0.1:8384:8384"
    deploy: { resources: { limits: { memory: "${SYNCTHING_MEM_LIMIT:-256m}" } } }
    logging: *logging

  backup:
    # Backup berkala: dump database tervalidasi + cermin object storage (API S3) ke ./backups, salinan terenkripsi
    # ke S3 luar server (opsional), heartbeat pemantauan. Panduan: docs/DEPLOYMENT.md §4.
    # Base image infra/backup/Dockerfile HARUS sama dengan image service postgres (versi pg_dump = versi server).
    build: ./infra/backup
    image: akasha-backup:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: akasha
      PGDATABASE: akasha
      # Database lain yang ikut di-dump (db-<nama>-<waktu>.dump)
      EXTRA_DATABASES: workingspace_auth,akai
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      # Sumber berkas = object storage aplikasi (sama dengan backend)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ASSET_BUCKET: ${ASSET_BUCKET:-akasha-assets}
      # Salinan luar server (kosongkan OFFSITE_S3_BUCKET untuk menonaktifkan)
      OFFSITE_S3_PROVIDER: ${OFFSITE_S3_PROVIDER:-Other}
      OFFSITE_S3_ENDPOINT: ${OFFSITE_S3_ENDPOINT:-}
      OFFSITE_S3_REGION: ${OFFSITE_S3_REGION:-auto}
      OFFSITE_S3_ACCESS_KEY_ID: ${OFFSITE_S3_ACCESS_KEY_ID:-}
      OFFSITE_S3_SECRET_ACCESS_KEY: ${OFFSITE_S3_SECRET_ACCESS_KEY:-}
      OFFSITE_S3_BUCKET: ${OFFSITE_S3_BUCKET:-}
      OFFSITE_S3_PREFIX: ${OFFSITE_S3_PREFIX:-akasha}
      OFFSITE_RETENTION_DAYS: ${OFFSITE_RETENTION_DAYS:-30}
      # Alternatif S3: Google Drive / OneDrive (dipakai bila OFFSITE_S3_BUCKET kosong; docs/DEPLOYMENT.md §4)
      OFFSITE_DRIVE_TYPE: ${OFFSITE_DRIVE_TYPE:-}
      OFFSITE_DRIVE_TOKEN: ${OFFSITE_DRIVE_TOKEN:-}
      OFFSITE_DRIVE_FOLDER: ${OFFSITE_DRIVE_FOLDER:-akasha-backup}
      OFFSITE_DRIVE_CLIENT_ID: ${OFFSITE_DRIVE_CLIENT_ID:-}
      OFFSITE_DRIVE_CLIENT_SECRET: ${OFFSITE_DRIVE_CLIENT_SECRET:-}
      OFFSITE_ONEDRIVE_DRIVE_ID: ${OFFSITE_ONEDRIVE_DRIVE_ID:-}
      OFFSITE_ONEDRIVE_DRIVE_TYPE: ${OFFSITE_ONEDRIVE_DRIVE_TYPE:-personal}
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    # Base image mendeklarasikan VOLUME /var/lib/postgresql; tmpfs mencegah volume anonim baru tiap container dibuat
    tmpfs:
      - /var/lib/postgresql
    deploy: { resources: { limits: { memory: 512m, cpus: "1" } } }
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres18-data:
  redis-data:
  storage-data:
  onlyoffice-data:
  onlyoffice-logs:
  onlyoffice-fonts:
  hermes-data:
  syncthing-data:

networks:
  default:
  agent:
