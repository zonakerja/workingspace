name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Semua workspace Node (apps/*, services/robot) lewat Turborepo dari root monorepo
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx turbo run lint typecheck test build format:check

      # Uji end-to-end backend Akasha terhadap infrastruktur nyata (postgres, redis, object storage)
      - name: Start infrastructure
        run: docker compose up -d --wait
      - name: Migrate & seed
        working-directory: apps/akasha/api
        run: |
          cp .env.example .env
          npx prisma migrate deploy
          npm run prisma:seed
      - name: Check schema drift
        working-directory: apps/akasha/api
        run: |
          docker compose -f ../../../docker-compose.yml exec -T postgres psql -U postgres -c "CREATE DATABASE akasha_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - name: Smoke test
        working-directory: apps/akasha/api
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/v1/health && break; sleep 2; done
          npm run test:smoke
      - name: API log
        if: failure()
        run: cat apps/akasha/api/api.log
      # SSO workingspace.id (apps/auth/api): env dev dibuat skrip, database sendiri, smoke end-to-end (OIDC, admin, PIN)
      - name: SSO migrate, seed & smoke
        working-directory: apps/auth/api
        run: |
          docker compose -f ../../../docker-compose.yml exec -T postgres psql -U postgres -c "CREATE DATABASE workingspace_auth" -c "CREATE DATABASE workingspace_auth_shadow"
          npm run setup:dev
          npx prisma migrate deploy
          npm run prisma:seed
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
          node dist/main.js > auth.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4300/api/health && break; sleep 2; done
          node test/smoke.mjs
      - name: SSO log
        if: failure()
        run: cat apps/auth/api/auth.log
      # Akai API (apps/akai/api): gateway model; smoke memakai router tiruan lokal
      - name: Akai migrate & smoke
        working-directory: apps/akai/api
        run: |
          docker compose -f ../../../docker-compose.yml exec -T postgres psql -U postgres -c "CREATE DATABASE akai" -c "CREATE DATABASE akai_shadow"
          npm run setup:dev
          npx prisma migrate deploy
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
          node dist/main.js > akai.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4400/api/health && break; sleep 2; done
          node test/smoke.mjs
      - name: Akai log
        if: failure()
        run: cat apps/akai/api/akai.log

  docker:
    runs-on: ubuntu-24.04
    needs: [checks]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Akasha API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/akasha/api/Dockerfile
          push: false
          cache-from: type=gha,scope=akasha-api
          cache-to: type=gha,mode=max,scope=akasha-api
      - name: Build Akasha web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/akasha/web/Dockerfile
          push: false
          cache-from: type=gha,scope=akasha-web
          cache-to: type=gha,mode=max,scope=akasha-web
      - name: Build SSO API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth/api/Dockerfile
          push: false
          cache-from: type=gha,scope=auth-api
          cache-to: type=gha,mode=max,scope=auth-api
      - name: Build SSO web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/auth/web/Dockerfile
          push: false
          cache-from: type=gha,scope=auth-web
          cache-to: type=gha,mode=max,scope=auth-web
      - name: Build landing image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/landing/Dockerfile
          push: false
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing
      - name: Build Akai API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/akai/api/Dockerfile
          push: false
          cache-from: type=gha,scope=akai-api
          cache-to: type=gha,mode=max,scope=akai-api
      - name: Build Akai web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/akai/web/Dockerfile
          push: false
          cache-from: type=gha,scope=akai-web
          cache-to: type=gha,mode=max,scope=akai-web
      - name: Build robot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/robot/Dockerfile
          push: false
          cache-from: type=gha,scope=robot
          cache-to: type=gha,mode=max,scope=robot
