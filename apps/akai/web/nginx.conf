# Nginx image Akai web: SPA statis. /api & HTTPS ditangani Caddy (docker-compose.prod.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Tidak boleh dibingkai situs lain (clickjacking) dan hanya memanggil asal sendiri (model dipanggil lewat Akai API)
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
    try_files $uri $uri/ /index.html;
  }
}
