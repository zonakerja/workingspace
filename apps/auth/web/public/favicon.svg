      <stop offset="1" stop-color="#b6ec4f"/>
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="11" fill="url(#g)"/>
  <rect x="9" y="9" width="13" height="13" rx="3.5" fill="#fff" fill-opacity="0.95"/>
  <rect x="18" y="18" width="13" height="13" rx="3.5" fill="#fff" fill-opacity="0.55"/>
